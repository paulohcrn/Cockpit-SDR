name: Refresh SDR dashboard

on:
  # Pas d'horaire fixe : le rafraîchissement est déclenché à la demande, depuis le
  # bouton du dashboard (via /api/refresh) ou depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull HubSpot
        env:
          HUBSPOT_PAT: ${{ secrets.HUBSPOT_PAT }}
        run: python build_data.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/csv
          git diff --staged --quiet || git commit -m "chore: refresh SDR dashboard data"
          git push

      # Déploiement direct plutôt que de compter sur l'intégration Git↔Vercel (webhook
      # qui a cessé de se déclencher automatiquement sur ce projet).
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes
